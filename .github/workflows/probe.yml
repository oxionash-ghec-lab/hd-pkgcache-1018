name: probe
on:
  registry_package:
    types: [published, updated]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "PROBE_EVENT=${{ github.event_name }}"
          echo "PROBE_ACTOR=${{ github.actor }}"
          echo "PROBE_SHA=${{ github.sha }}"
          echo "PROBE_REF=${{ github.ref }}"
      - name: make payload
        run: |
          mkdir -p cachepayload
          echo "written-by-${{ github.actor }}-event-${{ github.event_name }}-run-${{ github.run_id }}" > cachepayload/marker.txt
      - name: SAVE cache (enforcement-level instrument; the owner-side entry ref is the measurement)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cachepayload
          key: hdprobe-${{ github.event_name }}-${{ github.run_id }}
